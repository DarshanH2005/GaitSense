[platformio]
default_envs = left, right

[env]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@2.3.6
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D SDA_PIN=6
  -D SCL_PIN=5
  -D FSR_DIRECT=1

[env:left]
build_flags = ${env.build_flags} -D INSOLE_RIGHT=0

[env:right]
build_flags = ${env.build_flags} -D INSOLE_RIGHT=1

; Retained for an optional later ADS1115 build. Do not flash these to the
; direct-ADC wiring described in docs/DIRECT_ADC_WIRING.md.
[env:ads_left]
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D SDA_PIN=4
  -D SCL_PIN=5
  -D FSR_DIRECT=0
  -D INSOLE_RIGHT=0

[env:ads_right]
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D SDA_PIN=4
  -D SCL_PIN=5
  -D FSR_DIRECT=0
  -D INSOLE_RIGHT=1
